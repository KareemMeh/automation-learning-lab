
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Support Portal</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- Login Screen -->
    <main>
            <!-- login screen -->
        <section  class="login-container" id="loginScreen">
            <div class="login-card">
                <h1>Customer Support</h1>
                
                <p>سجّل دخولك للتواصل مع خدمة العملاء</p>
                
                <form id="loginForm">
                
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" required autocomplete="username" placeholder="example@email.com">
                
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="كلمة المرور">
                
                    <button type="submit" id="loginButton">
                        تسجيل الدخول
                    </button>
                
                    <p id="loginMessage" role="status" aria-live="polite"></p>
                
                </form>
            </div>
          

        </section>

            <!-- Customer Chat Screen -->
        <section id="chatScreen" class="chat-screen" hidden>
            
                <div class="chat-container">
            
                    <!-- Chat Header -->
                    <header class="chat-header">
            
                        <div class="chat-header-info">
                            <div class="assistant-avatar">AI</div>
            
                            <div>
                                <h2>خدمة العملاء</h2>
                                <p>مساعدك الذكي لمتابعة الطلبات والشكاوى</p>
                            </div>
                        </div>
            
                        <button type="button" id="logoutButton" class="logout-button">
                            تسجيل الخروج
                        </button>
            
                    </header>
                    

                    
                    <!-- Conversation -->
                    <div id="chatMessages" class="chat-messages" role="log" aria-live="polite" aria-label="محادثة خدمة العملاء">
                        <div class="message assistant-message">
                            أهلاً بيك 👋
                            أقدر أساعدك في متابعة أوردراتك
                            أو تجهيز طلب شكوى.
                        </div>
                    </div>
                    <div id="approvalArea" hidden></div>

                    <!-- Message Input -->
                    <form id="chatForm" class="chat-form">
            
                        <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." autocomplete="off" maxlength="2000"
                            required>
            
                        <button type="submit" id="sendButton">
                            إرسال
                        </button>
            
                    </form>
            
                </div>
            
        </section>

    </main>


    <script src="/static/app.js"></script>

</body>
</html>
